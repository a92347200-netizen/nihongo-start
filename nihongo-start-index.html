<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>니혼고 첫걸음</title>
<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--ink:#191b24;--muted:#777b89;
  --primary:#6c5ce7;--primary2:#8b7cf6;--accent:#ffcf5c;--good:#18a673;--bad:#e85d75;
  --line:#ececf2;--shadow:0 14px 36px rgba(28,25,55,.09);--r:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#e9eaf0;color:var(--ink)}
button{font:inherit;border:0;cursor:pointer}
#app{width:100%;max-width:460px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;min-height:100vh;padding:22px 18px 96px;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.splash{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#191a26,#2e2b55);color:#fff;padding:28px}
.splash.active{display:flex}
.logo{width:78px;height:78px;border-radius:25px;display:grid;place-items:center;margin:0 auto 20px;filter:drop-shadow(0 14px 20px rgba(0,0,0,.2))}
.splash h1{font-size:31px;letter-spacing:-1.5px;margin:0 0 10px}
.splash p{color:#d8d8e8;margin:0 0 34px;line-height:1.7}
.primary{width:100%;padding:17px 20px;border-radius:17px;background:var(--primary);color:white;font-weight:800;box-shadow:0 10px 22px rgba(108,92,231,.25)}
.primary:active,.choice:active,.menu-card:active{transform:scale(.985)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-weight:900;font-size:20px;letter-spacing:-.7px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);box-shadow:0 5px 16px rgba(0,0,0,.06)}
.greeting{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px}
.hero{background:linear-gradient(140deg,#6c5ce7,#9184f7);color:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-45px;top:-45px;background:rgba(255,255,255,.12)}
.hero h2{margin:0 0 5px;font-size:26px;letter-spacing:-1px}
.hero p{margin:0;color:#e9e7ff}
.progress-wrap{margin-top:22px}
.progress-line{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.progress-line span{display:block;height:100%;background:#fff;border-radius:99px;transition:.35s}
.progress-text{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;color:#eee}
.section-title{font-size:18px;font-weight:900;margin:25px 2px 12px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-card{background:var(--surface);border:1px solid var(--line);border-radius:21px;padding:18px;text-align:left;min-height:135px;box-shadow:0 8px 22px rgba(0,0,0,.035);transition:.15s}
.menu-icon{font-size:28px;margin-bottom:13px}
.menu-card strong{display:block;font-size:16px}.menu-card small{color:var(--muted);display:block;margin-top:4px}
.today{margin-top:12px;background:#fff;border-radius:22px;padding:20px;border:1px solid var(--line)}
.today-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.jp-mini{font-size:27px;font-weight:900}.kr{color:var(--muted);font-size:13px;margin-top:3px}
.small-primary{padding:12px 14px;border-radius:13px;background:#f0edff;color:#5a4bd1;font-weight:800;white-space:nowrap}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);height:76px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;z-index:20;padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav{flex:1;background:none;color:#9a9ca7;font-size:11px;font-weight:800;border-radius:15px}.nav span{display:block;font-size:21px;margin-bottom:2px}.nav.active{color:var(--primary);background:#f1efff}
.back{display:flex;align-items:center;gap:10px;margin-bottom:20px}.back button{background:none;font-size:24px}.back strong{font-size:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px 20px;box-shadow:var(--shadow);text-align:center}
.tag{display:inline-flex;padding:7px 10px;background:#f0edff;color:#5a4bd1;border-radius:99px;font-size:12px;font-weight:900;margin-bottom:18px}
.jp{font-size:44px;font-weight:900;letter-spacing:-2px;margin:5px 0}.kana{font-size:17px;color:#777b89}.pron{font-size:19px;font-weight:800;margin-top:8px}.meaning{font-size:15px;color:#666;margin-top:6px}
.example{margin:22px 0 0;padding:16px;border-radius:17px;background:#f7f7fb;text-align:left}.example b{font-size:17px}.example small{display:block;color:#777;margin-top:5px}
.speak{margin:22px auto 0;padding:14px 18px;border-radius:15px;background:#191b24;color:#fff;font-weight:900;display:inline-flex;align-items:center;gap:8px}.speak.playing{background:var(--primary);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(108,92,231,.12)}}
.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:15px;border-radius:15px;font-weight:900}.ghost{background:#f0f0f5;color:#555}
.quiz-card{text-align:left}.quiz-num{color:var(--primary);font-weight:900;font-size:13px}.quiz-q{font-size:25px;font-weight:900;margin:13px 0 22px;letter-spacing:-.8px}.choices{display:grid;gap:10px}.choice{padding:16px;border-radius:16px;background:#fff;border:2px solid var(--line);text-align:left;font-weight:800;transition:.15s}.choice.correct{border-color:var(--good);background:#ecfaf4;color:#087a54}.choice.wrong{border-color:var(--bad);background:#fff0f3;color:#bd4058}.feedback{margin-top:14px;padding:13px;border-radius:14px;background:#f6f6fa;font-weight:800;text-align:center;display:none}.feedback.show{display:block}
.result{text-align:center;padding-top:30px}.score-ring{width:150px;height:150px;border-radius:50%;margin:15px auto 22px;background:conic-gradient(var(--primary) var(--score),#e7e6ee 0);display:grid;place-items:center;position:relative}.score-ring:after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}.score-num{position:relative;z-index:1;font-size:38px;font-weight:950}.result h2{font-size:28px;margin:0}.result p{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:91px;transform:translate(-50%,15px);background:#20212a;color:#fff;padding:11px 15px;border-radius:13px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.empty-note{font-size:12px;color:#888;margin-top:10px}
@media(max-width:370px){.screen{padding-left:14px;padding-right:14px}.jp{font-size:38px}.menu-grid{gap:9px}}
</style>
</head>
<body>
<div id="app">
  <section id="splash" class="screen splash active">
    <div>
      <div class="logo" aria-label="니혼고 첫걸음 로고">
        <svg viewBox="0 0 78 78" width="78" height="78" xmlns="http://www.w3.org/2000/svg">
          <rect width="78" height="78" rx="25" fill="#fff"/>
          <path d="M19 24h40v27H36l-10 8v-8h-7z" fill="#6c5ce7"/>
          <text x="39" y="44" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">あ</text>
        </svg>
      </div>
      <h1>니혼고 첫걸음</h1>
      <p>보고 · 듣고 · 따라 말하고<br>가볍게 시작하는 일본어</p>
      <button class="primary" onclick="startApp()">학습 시작하기</button>
    </div>
  </section>

  <main id="home" class="screen">
    <div class="top"><div><div class="greeting">오늘도 가볍게 시작해요 👋</div><div class="brand">니혼고 첫걸음</div></div><button class="icon-btn" onclick="resetProgress()" aria-label="진행 기록 초기화">↻</button></div>
    <div class="hero">
      <div style="font-size:12px;font-weight:800;opacity:.85">TODAY'S JAPANESE</div>
      <h2 id="todayJp">こんにちは</h2><p id="todayKr">안녕하세요</p>
      <div class="progress-wrap"><div class="progress-line"><span id="progressBar" style="width:0%"></span></div><div class="progress-text"><span>오늘의 학습</span><span id="progressText">0 / 5</span></div></div>
    </div>
    <div class="today"><div class="today-row"><div><div class="jp-mini">こんにちは</div><div class="kr">곤니치와 · 안녕하세요</div></div><button class="small-primary" onclick="openExpression(0)">학습하기</button></div></div>
    <div class="section-title">학습 메뉴</div>
    <div class="menu-grid">
      <button class="menu-card" onclick="openWords()"><div class="menu-icon">📝</div><strong>단어 학습</strong><small>기초 단어 10개</small></button>
      <button class="menu-card" onclick="openExpressions()"><div class="menu-icon">💬</div><strong>표현 학습</strong><small>자주 쓰는 표현</small></button>
      <button class="menu-card" onclick="startQuiz()"><div class="menu-icon">🎯</div><strong>미니 퀴즈</strong><small>5문제로 확인</small></button>
      <button class="menu-card" onclick="openExpression(0)"><div class="menu-icon">🔊</div><strong>발음 연습</strong><small>듣고 따라 말하기</small></button>
    </div>
    <nav class="bottom"><button class="nav active" onclick="goHome()"><span>⌂</span>홈</button><button class="nav" onclick="openWords()"><span>文</span>단어</button><button class="nav" onclick="openExpressions()"><span>💬</span>표현</button><button class="nav" onclick="startQuiz()"><span>✓</span>퀴즈</button></nav>
  </main>

  <section id="words" class="screen">
    <div class="back"><button onclick="goHome()">‹</button><strong>단어 학습</strong></div>
    <div class="card">
      <div class="tag" id="wordCount">1 / 10</div>
      <div class="jp" id="wordJp"></div><div class="kana" id="wordKana"></div><div class="pron" id="wordPron"></div><div class="meaning" id="wordMeaning"></div>
      <div class="example"><b id="wordEx"></b><small id="wordExKr"></small></div>
      <button class="speak" id="wordSpeak" onclick="speakCurrent('word')">🔊 발음 듣기</button>
    </div>
    <div class="actions"><button class="ghost" onclick="previousWord()">이전</button><button class="primary" onclick="nextWord()">다음 단어</button></div>
    <div class="empty-note">일본어 음성이 지원되는 기기에서는 실제 일본어 발음을 들을 수 있어요.</div>
  </section>

  <section id="expressions" class="screen">
    <div class="back"><button onclick="goHome()">‹</button><strong>표현 학습</strong></div>
    <div class="card">
      <div class="tag" id="exprCount">1 / 10</div>
      <div class="jp" id="exprJp"></div><div class="kana" id="exprKana"></div><div class="pron" id="exprPron"></div><div class="meaning" id="exprMeaning"></div>
      <div class="example"><b id="exprSituation"></b><small>실생활에서 자주 쓰는 기본 표현</small></div>
      <button class="speak" id="exprSpeak" onclick="speakCurrent('expr')">🔊 발음 듣기</button>
    </div>
    <div class="actions"><button class="ghost" onclick="previousExpr()">이전</button><button class="primary" onclick="nextExpr()">다음 표현</button></div>
    <div class="empty-note">먼저 발음을 듣고 소리 내어 따라 해보세요.</div>
  </section>

  <section id="quiz" class="screen">
    <div class="back"><button onclick="goHome()">‹</button><strong>오늘의 퀴즈</strong></div>
    <div class="card quiz-card">
      <div class="quiz-num" id="quizNum">문제 1 / 5</div>
      <div class="quiz-q" id="quizQuestion"></div>
      <button class="speak" id="quizSpeak" onclick="speakQuiz()">🔊 일본어 듣기</button>
      <div class="choices" id="choices" style="margin-top:18px"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <section id="result" class="screen result">
    <div class="back" style="text-align:left"><button onclick="goHome()">‹</button><strong>학습 결과</strong></div>
    <div class="score-ring" id="scoreRing"><div class="score-num" id="scoreNum">0</div></div>
    <h2 id="resultTitle">잘했어요!</h2><p id="resultText"></p>
    <button class="primary" onclick="startQuiz()" style="margin-top:22px">다시 도전</button>
    <button class="ghost" onclick="goHome()" style="width:100%;padding:16px;border-radius:16px;margin-top:10px;font-weight:900">홈으로</button>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
const words=[
 ["私","わたし","와타시","나, 저","私は学生です。","저는 학생입니다."],
 ["あなた","あなた","아나타","당신","あなたは先生ですか？","당신은 선생님인가요?"],
 ["先生","せんせい","센세이","선생님","先生、ありがとうございます。","선생님, 감사합니다."],
 ["学生","がくせい","가쿠세이","학생","私は学生です。","저는 학생입니다."],
 ["友達","ともだち","토모다치","친구","友達と話します。","친구와 이야기합니다."],
 ["家","いえ","이에","집","家に帰ります。","집에 돌아갑니다."],
 ["学校","がっこう","각코오","학교","学校へ行きます。","학교에 갑니다."],
 ["猫","ねこ","네코","고양이","猫が好きです。","고양이를 좋아합니다."],
 ["犬","いぬ","이누","개","犬がいます。","개가 있습니다."],
 ["水","みず","미즈","물","水をください。","물을 주세요."]
];
const expressions=[
 ["こんにちは","こんにちは","곤니치와","안녕하세요","👋 처음 만났을 때"],
 ["おはようございます","おはようございます","오하요 고자이마스","좋은 아침입니다","🌅 아침 인사"],
 ["こんばんは","こんばんは","곤방와","안녕하세요 / 좋은 저녁입니다","🌙 저녁 인사"],
 ["おやすみなさい","おやすみなさい","오야스미나사이","안녕히 주무세요","🌙 잠자기 전"],
 ["ありがとう","ありがとう","아리가토","고마워요","🙏 감사할 때"],
 ["ありがとうございます","ありがとうございます","아리가토 고자이마스","감사합니다","🙏 정중하게 감사할 때"],
 ["すみません","すみません","스미마센","죄송합니다 / 실례합니다","🙇 사과하거나 말을 걸 때"],
 ["お願いします","おねがいします","오네가이시마스","부탁합니다","🤝 부탁할 때"],
 ["大丈夫です","だいじょうぶです","다이조오부데스","괜찮습니다","👌 괜찮다고 말할 때"],
 ["はじめまして","はじめまして","하지메마시테","처음 뵙겠습니다","🤝 처음 만났을 때"]
];
let wordIndex=0,exprIndex=0,quizIndex=0,score=0,answered=false;
let progress=JSON.parse(localStorage.getItem("nihongo-progress")||'{"learned":0,"lastDate":""}');
function save(){localStorage.setItem("nihongo-progress",JSON.stringify(progress));updateHome()}
function updateHome(){const n=Math.min(progress.learned||0,5);document.getElementById("progressBar").style.width=(n/5*100)+"%";document.getElementById("progressText").textContent=n+" / 5"}
function startApp(){show("home");updateHome()}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}
function goHome(){show("home");updateHome()}
function openWords(){wordIndex=0;renderWord();show("words")}
function renderWord(){let x=words[wordIndex];wordCount.textContent=`${wordIndex+1} / ${words.length}`;wordJp.textContent=x[0];wordKana.textContent=x[1];wordPron.textContent=x[2];wordMeaning.textContent=x[3];wordEx.textContent=x[4];wordExKr.textContent=x[5];resetSpeak("wordSpeak")}
function nextWord(){if(wordIndex<words.length-1){wordIndex++;markLearned();renderWord()}else{toast("단어 학습을 모두 봤어요 🎉");markLearned()}}
function previousWord(){if(wordIndex>0){wordIndex--;renderWord()}}
function openExpressions(){exprIndex=0;renderExpr();show("expressions")}
function openExpression(i){exprIndex=i;renderExpr();show("expressions")}
function renderExpr(){let x=expressions[exprIndex];exprCount.textContent=`${exprIndex+1} / ${expressions.length}`;exprJp.textContent=x[0];exprKana.textContent=x[1];exprPron.textContent=x[2];exprMeaning.textContent=x[3];exprSituation.textContent=x[4];resetSpeak("exprSpeak")}
function nextExpr(){if(exprIndex<expressions.length-1){exprIndex++;markLearned();renderExpr()}else{toast("표현 학습을 모두 봤어요 🎉");markLearned()}}
function previousExpr(){if(exprIndex>0){exprIndex--;renderExpr()}}
function markLearned(){progress.learned=Math.min(5,(progress.learned||0)+1);progress.lastDate=new Date().toISOString().slice(0,10);save()}
function speak(text,buttonId){
 if(!("speechSynthesis" in window)){toast("이 기기에서는 음성 재생을 지원하지 않아요.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=.88;u.pitch=1;
 const btn=document.getElementById(buttonId);btn.classList.add("playing");btn.innerHTML="🔊 듣는 중...";
 u.onend=()=>resetSpeak(buttonId);u.onerror=()=>{resetSpeak(buttonId);toast("일본어 음성을 재생하지 못했어요.")};
 speechSynthesis.speak(u);
}
function resetSpeak(id){const b=document.getElementById(id);if(b){b.classList.remove("playing");b.innerHTML="🔊 "+(id==="quizSpeak"?"일본어 듣기":"발음 듣기")}}
function speakCurrent(type){if(type==="word")speak(words[wordIndex][0],"wordSpeak");else speak(expressions[exprIndex][0],"exprSpeak")}
function startQuiz(){
 quizIndex=0;score=0;answered=false;renderQuiz();show("quiz")
}
function quizData(){
 const qs=[
  ["こんにちは","안녕하세요",["안녕하세요","고마워요","잘 자요","미안합니다"]],
  ["ありがとう","고마워요",["고마워요","안녕하세요","학교","친구"]],
  ["すみません","죄송합니다 / 실례합니다",["괜찮습니다","죄송합니다 / 실례합니다","좋은 아침입니다","학생"]],
  ["おやすみなさい","안녕히 주무세요",["안녕하세요","감사합니다","안녕히 주무세요","부탁합니다"]],
  ["大丈夫です","괜찮습니다",["괜찮습니다","고양이","선생님","내일"]]
 ];return qs[quizIndex]
}
function renderQuiz(){
 answered=false;const q=quizData();quizNum.textContent=`문제 ${quizIndex+1} / 5`;quizQuestion.textContent=q[0];feedback.className="feedback";feedback.textContent="";
 const arr=[...q[2]].sort(()=>Math.random()-.5);choices.innerHTML=arr.map(a=>`<button class="choice" onclick="answerQuiz(this,'${escapeJs(a)}')">${a}</button>`).join("");resetSpeak("quizSpeak")
}
function escapeJs(s){return s.replaceAll("\\","\\\\").replaceAll("'","\\'")}
function answerQuiz(btn,a){
 if(answered)return;answered=true;const q=quizData();const ok=a===q[1];if(ok)score++;
 document.querySelectorAll(".choice").forEach(b=>{if(b.textContent===q[1])b.classList.add("correct")});
 if(!ok)btn.classList.add("wrong");
 feedback.textContent=ok?"✓ 정답이에요!":"아쉬워요. 정답을 다시 확인해 보세요.";
 feedback.classList.add("show");
 setTimeout(()=>{if(quizIndex<4){quizIndex++;renderQuiz()}else{finishQuiz()}},850)
}
function speakQuiz(){speak(quizData()[0],"quizSpeak")}
function finishQuiz(){
 progress.learned=5;progress.lastDate=new Date().toISOString().slice(0,10);save();
 const pct=score*20;scoreNum.textContent=pct;scoreRing.style.setProperty("--score",pct+"%");resultText.textContent=`5문제 중 ${score}문제를 맞혔어요.`;resultTitle.textContent=score===5?"완벽해요! 🎉":score>=3?"잘했어요! 👏":"다시 한번 도전해볼까요?";
 show("result")
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove("show"),1900)}
function resetProgress(){if(confirm("학습 기록을 초기화할까요?")){progress={learned:0,lastDate:""};save();toast("학습 기록을 초기화했어요.")}}
updateHome();
